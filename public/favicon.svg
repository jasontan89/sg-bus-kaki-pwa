<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="busBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="windshield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b132b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Bus Main Shadow -->
  <ellipse cx="256" cy="428" rx="160" ry="24" fill="#0b132b" opacity="0.35"/>

  <!-- Bus Group with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Main Bus Body (Lush green SG bus style with rounded cartoon charm) -->
    <rect x="116" y="120" width="280" height="260" rx="64" fill="url(#busBody)"/>
    
    <!-- Top Double-Decker Roof Accent -->
    <path d="M 160 120 Q 256 100 352 120 Z" fill="url(#roofGrad)"/>

    <!-- LED Route Destination Screen -->
    <rect x="166" y="136" width="180" height="36" rx="10" fill="#0f172a"/>
    <text x="256" y="161" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="#fbbf24" text-anchor="middle" letter-spacing="2">BUS KAKI 🚌</text>

    <!-- Upper Deck Window / Windshield -->
    <rect x="146" y="184" width="220" height="96" rx="28" fill="url(#windshield)"/>

    <!-- Cute Big Cartoon Eyes in the Upper Windshield -->
    <!-- Left Eye -->
    <ellipse cx="206" cy="232" rx="26" ry="32" fill="#0f172a"/>
    <ellipse cx="214" cy="222" rx="10" ry="14" fill="#ffffff"/>
    <circle cx="200" cy="242" r="5" fill="#ffffff"/>

    <!-- Right Eye -->
    <ellipse cx="306" cy="232" rx="26" ry="32" fill="#0f172a"/>
    <ellipse cx="314" cy="222" rx="10" ry="14" fill="#ffffff"/>
    <circle cx="300" cy="242" r="5" fill="#ffffff"/>

    <!-- Cute Rosy Cheeks -->
    <ellipse cx="166" cy="262" rx="16" ry="9" fill="#f43f5e" opacity="0.55"/>
    <ellipse cx="346" cy="262" rx="16" ry="9" fill="#f43f5e" opacity="0.55"/>

    <!-- Lower Deck / Front Grill & Smile -->
    <rect x="146" y="296" width="220" height="68" rx="20" fill="#ffffff"/>

    <!-- Big Happy Cartoon Smile -->
    <path d="M 216 324 Q 256 354 296 324" stroke="#0f172a" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Tongue peeking out -->
    <path d="M 242 334 Q 256 352 270 334 Z" fill="#f43f5e"/>

    <!-- Headlights -->
    <!-- Left Headlight -->
    <circle cx="172" cy="330" r="14" fill="#fef08a" stroke="#eab308" stroke-width="3"/>
    <!-- Right Headlight -->
    <circle cx="340" cy="330" r="14" fill="#fef08a" stroke="#eab308" stroke-width="3"/>

    <!-- Front Bumper -->
    <rect x="136" y="364" width="240" height="18" rx="9" fill="#334155"/>

    <!-- Left Wheel -->
    <rect x="136" y="374" width="38" height="34" rx="12" fill="#1e293b"/>
    <circle cx="155" cy="391" r="7" fill="#94a3b8"/>

    <!-- Right Wheel -->
    <rect x="338" y="374" width="38" height="34" rx="12" fill="#1e293b"/>
    <circle cx="357" cy="391" r="7" fill="#94a3b8"/>

    <!-- Cute Transit Cap / Antenna on Top -->
    <circle cx="256" cy="98" r="8" fill="#38bdf8"/>
    <line x1="256" y1="98" x2="256" y2="114" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
